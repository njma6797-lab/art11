<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>جهاز رسم ثابت - نمر</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none; /* الصورة ثابتة */
}
</style>
</head>
<body>

<img src="file_00000000b7d071f5a3410d81289d90cf.png" alt="Neon Tiger">

<script>
// منع كليك يمين
document.addEventListener("contextmenu", e => e.preventDefault());

// منع اختصارات متكررة
document.addEventListener("keydown", e => {
  if (
    e.key === "PrintScreen" ||            
    (e.ctrlKey && e.key === "s") ||      
    (e.ctrlKey && e.key === "c") ||      
    (e.ctrlKey && e.key === "u") ||      
    (e.ctrlKey && e.key === "p")         
  ) {
    e.preventDefault();
    e.stopPropagation();
    alert("هذا الجهاز ثابت، لا يمكن التفاعل.");
  }
});

// منع لمس أو سحب الشاشة
document.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("touchend", e => e.preventDefault(), { passive: false });

// منع الضغط على الفأرة
document.addEventListener("mousedown", e => e.preventDefault());
document.addEventListener("mouseup", e => e.preventDefault());
</script>

</body>
</html>
